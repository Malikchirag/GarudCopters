services:
  garud-copters-cv:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Optional -- only needed for the /report LLM-narrative step (app/agent.py).
      # Severity + recommended action still work without it (rule-based).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GARUD_CV_CONF=${GARUD_CV_CONF:-0.35}
    volumes:
      # Swap in a newly-trained checkpoint without rebuilding the image.
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
